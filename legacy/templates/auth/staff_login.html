{% extends "base.html" %}

{% block title %}Đăng nhập Nhân viên | Hutech Bus{% endblock %}

{% block content %}
<section class="auth-shell admin-auth">
    <div class="auth-card" style="max-width:460px;">
        <div style="text-align:center; margin-bottom:1.8rem;">
            <a href="/" class="auth-brand">
                <span class="auth-brand-icon"><i class="ri-briefcase-4-line"></i></span>
                <span>Cổng Nhân viên</span>
            </a>
            <h1 class="auth-heading" style="margin-top:1.2rem;">Đăng nhập vận hành</h1>
            <p class="auth-copy" style="margin-top:.45rem;">Dành cho nhân viên trạm, kiểm soát vé và bộ phận phòng vé của nhà xe.</p>
        </div>

        <form action="{{ url_for('staff_login') }}" method="POST">
            <div class="auth-field">
                <label class="auth-label">Email công việc</label>
                <div class="input-icon-wrap">
                    <i class="ri-mail-line"></i>
                    <input type="email" name="email" class="auth-input" placeholder="staff@company.vn" required>
                </div>
            </div>

            <div class="auth-field">
                <label class="auth-label">Mật khẩu</label>
                <div class="input-icon-wrap">
                    <i class="ri-lock-line"></i>
                    <input type="password" name="password" id="staff-password" class="auth-input" placeholder="••••••••" required style="padding-right:3rem;">
                    <button type="button" onclick="toggleStaffPw()" style="position:absolute; right:.95rem; top:50%; transform:translateY(-50%); background:none; color:rgba(255,255,255,.74); padding:.2rem;">
                        <i class="ri-eye-line" id="staff-password-eye"></i>
                    </button>
                </div>
            </div>

            <div class="auth-actions">
                <button type="submit" class="btn-primary" style="width:100%;"><i class="ri-login-box-line"></i> Đăng nhập</button>
            </div>
        </form>

        <div class="auth-divider">dành cho nhà xe</div>
        <a href="{{ url_for('company_login') }}" class="auth-alt-card switch-link">
            <i class="ri-building-line"></i>
            <span>Chuyển sang đăng nhập quản trị viên</span>
        </a>
    </div>
</section>

<script>
function toggleStaffPw() {
    const field = document.getElementById('staff-password');
    const eye = document.getElementById('staff-password-eye');
    if (field.type === 'password') {
        field.type = 'text';
        eye.className = 'ri-eye-off-line';
    } else {
        field.type = 'password';
        eye.className = 'ri-eye-line';
    }
}
</script>
{% endblock %}
