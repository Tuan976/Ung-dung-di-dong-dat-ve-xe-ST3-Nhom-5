{% extends "base.html" %}

{% block title %}Đặt lại mật khẩu | Hutech Bus{% endblock %}

{% block content %}
<div
    style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:linear-gradient(135deg,#f8faff,#e8f0fe);">
    <div style="width:100%; max-width:420px;">
        <div
            style="background:white; border-radius:24px; padding:2.5rem; box-shadow:0 20px 60px rgba(0,0,0,0.1); position:relative; overflow:hidden;">
            <div
                style="position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, var(--primary), #7c3aed);">
            </div>

            <!-- Header -->
            <div style="text-align:center; margin-bottom:2rem;">
                <div
                    style="width:64px; height:64px; background:linear-gradient(135deg, var(--primary), #1a237e); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:white; margin:0 auto 1rem; box-shadow:0 8px 24px rgba(40,135,255,0.3);">
                    <i class="ri-lock-password-line"></i>
                </div>
                <h1 style="font-size:1.5rem; font-weight:900; color:var(--text-dark); margin-bottom:0.35rem;">Đặt lại
                    mật khẩu</h1>
                <p style="color:var(--text-gray); font-size:0.9rem;">Tạo mật khẩu mới cho tài khoản của bạn</p>
            </div>

            <form action="{{ url_for('reset_new_password') }}" method="POST">

                <!-- New password -->
                <div style="margin-bottom:1rem;">
                    <label
                        style="display:block; font-size:0.78rem; font-weight:700; color:var(--text-gray); margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:0.5px;">Mật
                        khẩu mới</label>
                    <div style="position:relative;">
                        <i class="ri-lock-line"
                            style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--primary); pointer-events:none;"></i>
                        <input type="password" name="password" id="pw-new" required minlength="6"
                            placeholder="Ít nhất 6 ký tự"
                            style="width:100%; padding:0.85rem 2.75rem 0.85rem 2.75rem; border:2px solid var(--bg-light); border-radius:12px; font-size:0.95rem; background:var(--bg-light); font-family:inherit; transition:all 0.2s; outline:none;"
                            onfocus="this.style.borderColor='var(--primary)'; this.style.background='white'; this.style.boxShadow='0 0 0 4px rgba(40,135,255,0.08)';"
                            onblur="this.style.borderColor='var(--bg-light)'; this.style.background='var(--bg-light)'; this.style.boxShadow='';">
                        <button type="button" onclick="togglePw('pw-new','eye-new')"
                            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-light); cursor:pointer; font-size:1rem;">
                            <i class="ri-eye-line" id="eye-new"></i>
                        </button>
                    </div>

                    <!-- Strength meter -->
                    <div style="margin-top:0.6rem;">
                        <div style="display:flex; gap:4px; margin-bottom:0.35rem;">
                            <div id="s1"
                                style="flex:1; height:4px; background:#e5e7eb; border-radius:2px; transition:background 0.3s;">
                            </div>
                            <div id="s2"
                                style="flex:1; height:4px; background:#e5e7eb; border-radius:2px; transition:background 0.3s;">
                            </div>
                            <div id="s3"
                                style="flex:1; height:4px; background:#e5e7eb; border-radius:2px; transition:background 0.3s;">
                            </div>
                            <div id="s4"
                                style="flex:1; height:4px; background:#e5e7eb; border-radius:2px; transition:background 0.3s;">
                            </div>
                        </div>
                        <div id="strength-label" style="font-size:0.75rem; color:var(--text-light);">Nhập mật khẩu để
                            kiểm tra độ mạnh</div>
                    </div>
                </div>

                <!-- Confirm password -->
                <div style="margin-bottom:1.75rem;">
                    <label
                        style="display:block; font-size:0.78rem; font-weight:700; color:var(--text-gray); margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:0.5px;">Xác
                        nhận mật khẩu</label>
                    <div style="position:relative;">
                        <i class="ri-lock-2-line"
                            style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--primary); pointer-events:none;"></i>
                        <input type="password" name="confirm_password" id="pw-confirm" required
                            placeholder="Nhập lại mật khẩu"
                            style="width:100%; padding:0.85rem 2.75rem 0.85rem 2.75rem; border:2px solid var(--bg-light); border-radius:12px; font-size:0.95rem; background:var(--bg-light); font-family:inherit; transition:all 0.2s; outline:none;"
                            onfocus="this.style.borderColor='var(--primary)'; this.style.background='white'; this.style.boxShadow='0 0 0 4px rgba(40,135,255,0.08)';"
                            onblur="this.style.borderColor='var(--bg-light)'; this.style.background='var(--bg-light)'; this.style.boxShadow='';"
                            oninput="checkMatch()">
                        <button type="button" onclick="togglePw('pw-confirm','eye-confirm')"
                            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-light); cursor:pointer; font-size:1rem;">
                            <i class="ri-eye-line" id="eye-confirm"></i>
                        </button>
                    </div>
                    <div id="match-msg" style="font-size:0.78rem; margin-top:0.4rem; color:var(--text-light);"></div>
                </div>

                <button type="submit" id="submit-btn" class="bt-btn bt-btn-primary"
                    style="width:100%; font-size:1rem; padding:0.9rem; border-radius:12px; font-weight:800;">
                    <i class="ri-save-line"></i> Lưu mật khẩu mới
                </button>
            </form>

            <p style="text-align:center; margin-top:1.5rem; font-size:0.88rem;">
                <a href="/" style="color:var(--text-gray); display:inline-flex; align-items:center; gap:0.35rem;">
                    <i class="ri-close-line"></i> Hủy bỏ, về trang chủ
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    function togglePw(fieldId, eyeId) {
        const f = document.getElementById(fieldId);
        const e = document.getElementById(eyeId);
        f.type = f.type === 'password' ? 'text' : 'password';
        e.className = f.type === 'password' ? 'ri-eye-line' : 'ri-eye-off-line';
    }

    document.getElementById('pw-new').addEventListener('input', function () {
        const pw = this.value;
        const bars = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3'), document.getElementById('s4')];
        const label = document.getElementById('strength-label');
        let score = 0;
        if (pw.length >= 6) score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw) && /[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;

        const colors = ['#ef4444', '#f59e0b', '#10b981', '#2887ff'];
        const labels = ['Quá yếu', 'Yếu', 'Trung bình', 'Mạnh 💪'];
        bars.forEach((bar, i) => {
            bar.style.background = i < score ? colors[score - 1] : '#e5e7eb';
        });
        if (pw.length > 0) {
            label.style.color = colors[score - 1] || '#9ca3af';
            label.textContent = score > 0 ? labels[score - 1] : 'Quá yếu';
        } else {
            label.textContent = 'Nhập mật khẩu để kiểm tra độ mạnh';
            label.style.color = 'var(--text-light)';
        }
    });

    function checkMatch() {
        const pw = document.getElementById('pw-new').value;
        const cpw = document.getElementById('pw-confirm').value;
        const msg = document.getElementById('match-msg');
        const btn = document.getElementById('submit-btn');
        if (cpw.length === 0) {
            msg.textContent = ''; return;
        }
        if (pw === cpw) {
            msg.style.color = 'var(--success)';
            msg.textContent = '✓ Mật khẩu khớp nhau';
            btn.disabled = false;
        } else {
            msg.style.color = 'var(--danger)';
            msg.textContent = '✗ Mật khẩu chưa khớp';
        }
    }
</script>
{% endblock %}
