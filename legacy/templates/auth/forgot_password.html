{% extends "base.html" %}

{% block title %}Quên mật khẩu | Hutech Bus{% endblock %}

{% block content %}
<div
    style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:linear-gradient(135deg,#f8faff,#e8f0fe);">
    <div style="width:100%; max-width:440px;">
        <div
            style="background:white; border-radius:24px; padding:2.5rem; box-shadow:0 20px 60px rgba(0,0,0,0.1); position:relative; overflow:hidden;">
            <div
                style="position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, var(--warning), var(--accent));">
            </div>

            <!-- Header -->
            <div style="text-align:center; margin-bottom:2rem;">
                <div
                    style="width:64px; height:64px; background:linear-gradient(135deg,#f59e0b,#d97706); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:white; margin:0 auto 1rem; box-shadow:0 8px 24px rgba(245,158,11,0.3);">
                    <i class="ri-lock-password-line"></i>
                </div>
                <h1 style="font-size:1.5rem; font-weight:900; color:var(--text-dark); margin-bottom:0.35rem;">Quên mật
                    khẩu?</h1>
                <p style="color:var(--text-gray); font-size:0.9rem;">Nhập email để nhận mã OTP xác thực</p>
            </div>

            <form action="{{ url_for('forgot_password') }}" method="POST">

                <!-- Role selection -->
                <div style="margin-bottom:1.25rem;">
                    <label
                        style="display:block; font-size:0.78rem; font-weight:700; color:var(--text-gray); margin-bottom:0.6rem; text-transform:uppercase; letter-spacing:0.5px;">Bạn
                        là</label>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
                        <label
                            style="display:flex; align-items:center; gap:0.75rem; padding:0.85rem 1rem; border:2px solid var(--primary); border-radius:12px; cursor:pointer; background:rgba(40,135,255,0.05);"
                            id="role-passenger-label">
                            <input type="radio" name="role" value="passenger" checked onchange="toggleRole()"
                                style="transform:scale(1.2);">
                            <div>
                                <div style="font-weight:700; font-size:0.9rem; color:var(--primary);">🧍 Hành khách
                                </div>
                            </div>
                        </label>
                        <label
                            style="display:flex; align-items:center; gap:0.75rem; padding:0.85rem 1rem; border:2px solid var(--bg-light); border-radius:12px; cursor:pointer;"
                            id="role-company-label">
                            <input type="radio" name="role" value="company" onchange="toggleRole()"
                                style="transform:scale(1.2);">
                            <div>
                                <div style="font-weight:700; font-size:0.9rem; color:var(--text-dark);">🏢 Nhà xe</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Email -->
                <div style="margin-bottom:1.75rem;">
                    <label
                        style="display:block; font-size:0.78rem; font-weight:700; color:var(--text-gray); margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:0.5px;">Email
                        đã đăng ký</label>
                    <div style="position:relative;">
                        <i class="ri-mail-line"
                            style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--primary); pointer-events:none;"></i>
                        <input type="email" name="email" required placeholder="name@example.com"
                            style="width:100%; padding:0.85rem 1rem 0.85rem 2.75rem; border:2px solid var(--bg-light); border-radius:12px; font-size:0.95rem; background:var(--bg-light); font-family:inherit; transition:all 0.2s; outline:none;"
                            onfocus="this.style.borderColor='var(--primary)'; this.style.background='white'; this.style.boxShadow='0 0 0 4px rgba(40,135,255,0.08)';"
                            onblur="this.style.borderColor='var(--bg-light)'; this.style.background='var(--bg-light)'; this.style.boxShadow='';">
                    </div>
                </div>

                <button type="submit" class="bt-btn bt-btn-primary"
                    style="width:100%; font-size:1rem; padding:0.9rem; border-radius:12px; font-weight:800;">
                    <i class="ri-mail-send-line"></i> Gửi mã OTP
                </button>
            </form>

            <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-gray);">
                <a href="/passenger/login"
                    style="color:var(--primary); font-weight:700; display:inline-flex; align-items:center; gap:0.35rem;">
                    <i class="ri-arrow-left-line"></i> Quay lại đăng nhập
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    function toggleRole() {
        const vals = document.querySelectorAll('input[name="role"]');
        vals.forEach(v => {
            const lbl = v.closest('label');
            if (v.checked) {
                lbl.style.borderColor = 'var(--primary)';
                lbl.style.background = 'rgba(40,135,255,0.05)';
                lbl.querySelector('div').style.color = 'var(--primary)';
            } else {
                lbl.style.borderColor = 'var(--bg-light)';
                lbl.style.background = 'white';
                lbl.querySelector('div').style.color = 'var(--text-dark)';
            }
        });
    }
</script>
{% endblock %}
