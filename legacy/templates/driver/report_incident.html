{% extends "driver/layout.html" %}

{% block driver_content %}
<div style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
    <a href="{{ url_for('driver.trip_detail', trip_id=trip.id) }}" style="color: var(--text);"><i class="fas fa-chevron-left"></i> Quay lại</a>
</div>

<div class="card">
    <h2 style="font-size: 1.25rem; font-weight: 800; margin-top: 0;">Báo cáo sự cố</h2>
    <p style="color: var(--text-muted); font-size: 0.85rem;">Thông tin này sẽ được gửi ngay lập tức về phòng điều hành.</p>
    
    <form method="POST">
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">Loại sự cố</label>
            <select name="type" class="btn btn-secondary" style="text-align: left; background: white; border: 1px solid #e2e8f0;">
                <option value="BREAKDOWN">Hỏng xe (Chết máy/Xịt lốp...)</option>
                <option value="ACCIDENT">Va chạm / Tai nạn</option>
                <option value="DELAY">Tắc đường / Trễ chuyến</option>
                <option value="OTHER">Vấn đề khác</option>
            </select>
        </div>
        
        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">Vị trí hiện tại</label>
            <input type="text" name="location" placeholder="Ví dụ: Cao tốc Long Thành - KM20" class="btn btn-secondary" style="text-align: left; background: white; border: 1px solid #e2e8f0;" required>
        </div>
        
        <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">Mô tả chi tiết</label>
            <textarea name="description" rows="5" class="btn btn-secondary" style="text-align: left; background: white; border: 1px solid #e2e8f0; height: auto;" placeholder="Nêu rõ tình trạng hiện tại và số lượng khách trên xe..." required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary" style="background: #ef4444;">
            <i class="fas fa-paper-plane"></i> Gửi báo cáo khẩn cấp
        </button>
    </form>
</div>
{% endblock %}
