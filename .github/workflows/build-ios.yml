name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter packages
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS Release (Unsigned)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          cd mobile_app/build/ios/iphoneos
          mkdir -p Payload
          cp -RP Runner.app Payload/
          zip -r -y -q WebDatVeXe.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDatVeXe-iOS-IPA
          path: mobile_app/build/ios/iphoneos/WebDatVeXe.ipa
          retention-days: 7

      - name: Release IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ios-release-latest
          name: "Bản Cài Đặt iOS (IPA) Mới Nhất"
          body: |
            ### 📱 File cài đặt ứng dụng iOS (WebDatVeXe.ipa)
            - **Cập nhật mới nhất:**
              + Redesign giao diện Modern Orange & White toàn diện.
              + Tính năng Soát vé QR bằng cảm biến camera chuyên dụng cho Tài xế / Phụ xe.
              + Tự động sinh mã QR vé động chuẩn cho Hành khách trên vé điện tử.
              + Bản đồ Radar đón khách trực diện Google Maps (khắc phục lỗi bản đồ và tràn viền).
              + Quản lý nhà xe, phơi khách, điều xe cứu viện sự cố.
            - **Cách cài đặt trên iPhone:** Tải file `WebDatVeXe.ipa` và cài đặt qua **TrollStore**, **AltStore**, **Sideloadly**, hoặc **Scarlet**.
          files: mobile_app/build/ios/iphoneos/WebDatVeXe.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
