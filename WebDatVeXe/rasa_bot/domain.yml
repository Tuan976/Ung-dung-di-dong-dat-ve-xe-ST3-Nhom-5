version: "3.1"

intents:
  - greet
  - book_ticket
  - ask_price
  - ask_bus_info
  - provide_info

entities:
  - from
  - to
  - date
  - pax

slots:
  from:
    type: text
    mappings:
      - type: from_entity
        entity: from
  to:
    type: text
    mappings:
      - type: from_entity
        entity: to
  date:
    type: text
    mappings:
      - type: from_entity
        entity: date
  pax:
    type: text
    mappings:
      - type: from_entity
        entity: pax

responses:
  utter_greet:
    - text: "Dạ em chào anh/chị ạ! Em là trợ lý Hutech Bus. Em có thể giúp gì cho mình về lịch trình hay đặt vé không ạ?"
  
  utter_ask_from:
    - text: "Dạ mình muốn xuất phát từ đâu ạ?"
  
  utter_ask_to:
    - text: "Dạ mình muốn đi đến đâu ạ?"

  utter_ask_date:
    - text: "Dạ mình muốn đi vào ngày nào ạ?"

  utter_ask_pax:
    - text: "Dạ mình đi mấy người để em giữ chỗ ạ?"

  utter_bus_info:
    - text: "Hutech Bus bên em có dòng Limousine 34 phòng VIP và Giường nằm 40 chỗ đời mới ạ. Mình muốn trải nghiệm dòng nào ạ?"

  utter_price_info:
    - text: "Giá vé bên em dao động từ 200k - 450k tùy tuyến đường. Mình cho em xin điểm đi và đến để em báo giá chính xác nhé."
