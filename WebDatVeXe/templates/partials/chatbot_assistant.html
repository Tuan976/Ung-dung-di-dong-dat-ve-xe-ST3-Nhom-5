<div style="position:fixed; bottom:24px; right:24px; z-index:9999;">
    <button class="bt-chatbot-btn" id="bt-chatbot-toggle" aria-label="Mở chat AI">
        <i class="ri-robot-2-line"></i>
    </button>

    <div id="bt-chat-window" style="display:none; position:absolute; bottom:80px; right:0; width:380px; height:540px; background:white; border-radius:20px; box-shadow:var(--shadow-xl); flex-direction:column; overflow:hidden; border:1px solid rgba(0,0,0,0.08);">
        <div style="padding:1.25rem 1.5rem; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; display:flex; align-items:center; justify-content:space-between;">
            <div style="display:flex; align-items:center; gap:0.75rem;">
                <div style="width:38px; height:38px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem;">
                    <i class="ri-customer-service-2-line"></i>
                </div>
                <div>
                    <div style="font-weight:800; font-size:0.95rem;">Trợ lý thao tác web</div>
                    <div style="font-size:0.75rem; opacity:0.8;">🟢 Hỗ trợ 24/7</div>
                </div>
            </div>
            <div style="display:flex; gap:0.5rem;">
                <button id="bt-chatbot-maximize" style="background:transparent; border:none; color:white; cursor:pointer; font-size:0.9rem; padding:0.3rem;" title="Phóng to"><i class="ri-expand-diagonal-line"></i></button>
                <button id="bt-chatbot-close" style="background:transparent; border:none; color:white; cursor:pointer; font-size:1rem; padding:0.3rem;"><i class="ri-close-line"></i></button>
            </div>
        </div>
        <div id="bt-chat-messages" style="flex:1; padding:1.25rem; overflow-y:auto; display:flex; flex-direction:column; gap:1rem; background:#f8faff;">
            <div style="align-self:flex-start; background:white; padding:0.75rem 1rem; border-radius:12px 12px 12px 2px; max-width:85%; font-size:0.9rem; line-height:1.6; color:#333; box-shadow:0 2px 6px rgba(0,0,0,0.06);">
                Xin chào! 👋 Tôi có thể tìm chuyến, mở trang và thao tác các nút/ô nhập đang hiển thị.<br>
                Ví dụ: “bấm Đăng nhập”, “chọn ghế A1”, “điền email là test@gmail.com”, “mở báo cáo doanh thu”.
            </div>
        </div>
        <div style="padding:1rem; background:white; border-top:1px solid #f0f0f0; display:flex; gap:0.75rem;">
            <input type="text" id="bt-chat-input" placeholder="Bạn muốn thao tác gì?" style="flex:1; border:2px solid var(--bg-light); padding:0.65rem 1rem; border-radius:50px; outline:none; font-size:0.9rem; font-family:inherit; transition:border-color 0.3s;">
            <button id="bt-chat-send" style="width:40px; height:40px; border-radius:50%; background:var(--primary); color:white; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0;">
                <i class="ri-send-plane-fill"></i>
            </button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ai_page_actions.js') }}"></script>
<script>
(function () {
    const chatbotToggle = document.getElementById('bt-chatbot-toggle');
    const chatWindow = document.getElementById('bt-chat-window');
    const chatbotClose = document.getElementById('bt-chatbot-close');
    const chatbotMaximize = document.getElementById('bt-chatbot-maximize');
    const chatMessages = document.getElementById('bt-chat-messages');
    const chatInput = document.getElementById('bt-chat-input');
    const chatSend = document.getElementById('bt-chat-send');

    let chatHistory = [];
    let isMaximized = false;

    chatbotToggle?.addEventListener('click', () => {
        const isOpen = chatWindow.style.display === 'flex';
        chatWindow.style.display = isOpen ? 'none' : 'flex';
        chatWindow.style.flexDirection = 'column';
        if (!isOpen) chatInput?.focus();
    });

    chatbotClose?.addEventListener('click', () => { chatWindow.style.display = 'none'; });

    chatbotMaximize?.addEventListener('click', () => {
        isMaximized = !isMaximized;
        const icon = chatbotMaximize.querySelector('i');
        if (isMaximized) {
            chatWindow.style.cssText = 'display: flex; flex-direction: column; position: fixed; top: 20px; left: 20px; right: 20px; bottom: 20px; width: auto; height: auto; background: white; border-radius: 20px; box-shadow: var(--shadow-xl); overflow: hidden; border: 1px solid rgba(0,0,0,0.08); z-index: 10000;';
            if (icon) icon.className = 'ri-contract-left-right-line';
        } else {
            chatWindow.style.cssText = 'display: flex; flex-direction: column; position: absolute; bottom: 80px; right: 0; width: 380px; height: 540px; background: white; border-radius: 20px; box-shadow: var(--shadow-xl); overflow: hidden; border: 1px solid rgba(0,0,0,0.08);';
            if (icon) icon.className = 'ri-expand-diagonal-line';
        }
    });

    async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;
        addMsg('user', message);
        chatInput.value = '';
        const loadId = 'load-' + Date.now();
        const loadEl = document.createElement('div');
        loadEl.id = loadId;
        loadEl.style.cssText = 'align-self:flex-start; background:#eee; padding:0.75rem 1rem; border-radius:12px; font-size:0.85rem; color:#666; font-style:italic;';
        loadEl.innerHTML = '<i class="ri-loader-4-line" style="animation:spin 1s linear infinite"></i> Đang xử lý yêu cầu...';
        chatMessages.appendChild(loadEl);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        try {
            const res = await fetch('/api/ai/chatbot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message,
                    history: chatHistory,
                    current_path: window.location.pathname,
                    current_url: window.location.href,
                    page_actions: window.AIPageActions ? window.AIPageActions.collect() : []
                })
            });
            const data = await res.json();
            document.getElementById(loadId)?.remove();
            const text = (data.response || '').trim();
            addMsg('ai', text || 'Xin lỗi, tôi chưa xử lý được yêu cầu này.');
            chatHistory.push({ role: 'user', content: message });
            chatHistory.push({ role: 'assistant', content: text });
            if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12);
            if (data.action) {
                const handled = window.AIPageActions ? window.AIPageActions.execute(data.action) : false;
                if (!handled && data.action.type === 'open_booking' && data.action.trip_id) {
                    setTimeout(() => window.location.href = `/book/${data.action.trip_id}`, 1200);
                }
            }
        } catch (err) {
            const loadingNode = document.getElementById(loadId);
            if (loadingNode) loadingNode.textContent = 'Lỗi kết nối. Vui lòng thử lại!';
            else addMsg('ai', 'Lỗi kết nối. Vui lòng thử lại!');
        }
    }

    function addMsg(sender, text) {
        const el = document.createElement('div');
        if (sender === 'user') {
            el.style.cssText = 'align-self:flex-end; background:var(--primary); color:white; padding:0.75rem 1rem; border-radius:12px 12px 2px 12px; max-width:85%; font-size:0.9rem; line-height:1.6; white-space:pre-wrap;';
            el.textContent = text;
        } else {
            el.style.cssText = 'align-self:flex-start; background:white; padding:0.75rem 1rem; border-radius:12px 12px 12px 2px; max-width:85%; font-size:0.9rem; line-height:1.6; color:#333; box-shadow:0 2px 6px rgba(0,0,0,0.06); white-space:pre-wrap;';
            el.innerHTML = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--primary); font-weight:700; text-decoration:underline;">$1</a>');
        }
        chatMessages.appendChild(el);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatSend?.addEventListener('click', sendMessage);
    chatInput?.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    chatInput?.addEventListener('focus', e => { e.target.style.borderColor = 'var(--primary)'; });
    chatInput?.addEventListener('blur', e => { e.target.style.borderColor = 'var(--bg-light)'; });
})();
</script>
<style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
