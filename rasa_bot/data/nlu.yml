version: "3.1"

nlu:
- intent: greet
  examples: |
    - chào bạn
    - hi
    - hello
    - xin chào
    - chào em
    - chào hutech bus

- intent: book_ticket
  examples: |
    - mình muốn đặt vé
    - tôi muốn mua vé xe
    - hỗ trợ mình đặt vé với
    - đặt vé đi đà lạt
    - tìm chuyến xe đi nha trang
    - cho mình đặt 2 vé sài gòn đến đà lạt
    - book vé đi gia lai ngày mai

- intent: ask_price
  examples: |
    - giá vé bao nhiêu
    - vé này bao nhiêu tiền
    - có đắt không
    - vé sài gòn nha trang bao nhiêu vây em

- intent: ask_bus_info
  examples: |
    - nhà xe mình có xe gì
    - loại xe bên mình là gì
    - xe limousine hay giường nằm vậy
    - cabin hay giường ngồi

- intent: provide_info
  examples: |
    - mình đi từ sài gòn
    - đi từ hcm
    - đến đà lạt
    - đi nha trang
    - ngày 10/2
    - đi vào ngày mai
    - 2 người
    - 3 vé
    - mình đi 1 mình
